name: Build

on:
  workflow_call:
    inputs:
      run_integration_tests:
        description: Run services integration tests
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install
        name: Install dependencies
        with:
          ts: "true"
          python: "false"

      - name: Audit dependencies
        run: pnpm audit:high

      - name: Build API client
        run: pnpm build --filter='./packages/api'
        env:
          UNPRICE_API_KEY: ""
          NODE_ENV: test

      - name: Type-check
        run: pnpm typecheck
        env:
          NODE_ENV: test

      - name: Validate ingestion durable object migrations
        run: pnpm --filter api db:check:ingestion:migrations

      - name: Check formatting
        run: pnpm biome ci .

      - name: Check workspaces
        run: pnpm manypkg check

      # Phase 2 exit gate: control flow must branch on typed error codes, never
      # on human-readable messages/UI copy. Fails if any retired string-match
      # contract reappears in non-test source.
      - name: String-matched error contract gate
        run: |
          set -uo pipefail
          patterns='expectedSubscriptionPreconditionMessages|missingDefaultPaymentMethodMessages|includes\("payment method"\)|No immediate action required\.'
          if grep -rnE "$patterns" \
            --include='*.ts' --include='*.tsx' \
            --exclude='*.test.ts' --exclude='*.test.tsx' \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=.wrangler \
            internal apps packages; then
            echo "::error::String-matched error control-flow found. Branch on a typed code, not the message/copy."
            exit 1
          fi
          echo "OK: no string-matched error contracts in source."

      - name: Run tests
        run: pnpm test
        env:
          # fake database url
          DATABASE_URL: postgresql://postgresql:postgresql@localhost:5432/unprice
          NODE_ENV: test

      - name: Run workers-pool tests (real Durable Objects)
        run: pnpm test:workers
        env:
          # fake database url — miniflare DOs never reach a real database in these suites
          DATABASE_URL: postgresql://postgresql:postgresql@localhost:5432/unprice
          NODE_ENV: test

      - name: React Doctor (errors only)
        uses: millionco/react-doctor@v2
        with:
          version: "0.5.8"
          project: "nextjs"
          blocking: "error"

  integration-tests:
    name: Services integration tests
    if: ${{ inputs.run_integration_tests }}
    runs-on: ubuntu-latest
    needs:
      - build
    services:
      db:
        image: postgres:15.6
        env:
          POSTGRES_DB: unprice_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      pg_proxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: ".*"
        ports:
          - 5433:80
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install
        name: Install dependencies
        with:
          ts: "true"
          python: "false"

      - name: Build API client
        run: pnpm build --filter='./packages/api'
        env:
          UNPRICE_API_KEY: ""
          NODE_ENV: test

      - name: Run services integration tests
        run: pnpm --filter @unprice/services test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unprice_test
          NODE_ENV: test
          APP_ENV: test
          SKIP_ENV_VALIDATION: "true"
