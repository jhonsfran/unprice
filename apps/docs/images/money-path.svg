<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Unprice customer money path</title>
  <desc id="desc">A paid action flows through plan version, entitlement, budget and wallet checks, then is allowed or denied before work runs while invoice evidence is preserved.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7a72" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="22" fill="#fafaf9"/>
  <rect x="28" y="28" width="1144" height="464" rx="18" fill="#ffffff" stroke="#d7d2c8"/>

  <text x="70" y="76" fill="#21201c" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">The money path</text>
  <text x="70" y="108" fill="#63635e" font-family="Inter, Arial, sans-serif" font-size="18">Decide before the paid action runs. Keep the evidence for the invoice after.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="168" width="150" height="86" rx="14" fill="#e6f4ff" stroke="#0090ff"/>
    <text x="96" y="202" fill="#102a43" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Paid action</text>
    <text x="96" y="229" fill="#3f3f3a" font-family="SFMono-Regular, Menlo, monospace" font-size="13">POST /run</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="282" y="168" width="150" height="86" rx="14" fill="#f9f9f8" stroke="#d7d2c8"/>
    <text x="309" y="202" fill="#21201c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Plan version</text>
    <text x="309" y="229" fill="#63635e" font-family="SFMono-Regular, Menlo, monospace" font-size="13">pro@v3</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="168" width="150" height="86" rx="14" fill="#f9f9f8" stroke="#d7d2c8"/>
    <text x="520" y="202" fill="#21201c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Entitlement</text>
    <text x="520" y="229" fill="#63635e" font-family="SFMono-Regular, Menlo, monospace" font-size="13">access.check</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="706" y="168" width="150" height="86" rx="14" fill="#fff7c2" stroke="#ab6400"/>
    <text x="732" y="202" fill="#21201c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Budget</text>
    <text x="732" y="229" fill="#6f4b00" font-family="SFMono-Regular, Menlo, monospace" font-size="13">remaining $4.10</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="918" y="168" width="150" height="86" rx="14" fill="#f9f9f8" stroke="#d7d2c8"/>
    <text x="944" y="202" fill="#21201c" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Wallet</text>
    <text x="944" y="229" fill="#63635e" font-family="SFMono-Regular, Menlo, monospace" font-size="13">credits held</text>
  </g>

  <path d="M 230 211 H 270" stroke="#7c7a72" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 442 211 H 482" stroke="#7c7a72" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 654 211 H 694" stroke="#7c7a72" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 866 211 H 906" stroke="#7c7a72" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M 781 254 V 286" stroke="#ab6400" stroke-width="2.5"/>
  <path d="M 781 286 H 427 V 316" stroke="#30a46c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 781 286 H 735 V 316" stroke="#e54d2e" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="292" y="330" width="270" height="92" rx="14" fill="#edfdf3" stroke="#30a46c"/>
    <circle cx="330" cy="376" r="18" fill="#30a46c"/>
    <path d="M321 376 L328 383 L341 369" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="366" y="368" fill="#143c25" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">allow - checks pass</text>
    <text x="366" y="397" fill="#2b6b45" font-family="SFMono-Regular, Menlo, monospace" font-size="13">200 - work can run</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="330" width="270" height="92" rx="14" fill="#fff0ee" stroke="#e54d2e"/>
    <circle cx="638" cy="376" r="18" fill="#e54d2e"/>
    <path d="M629 367 L647 385 M647 367 L629 385" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="674" y="368" fill="#5f1b13" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">deny - over budget</text>
    <text x="674" y="392" fill="#8b2a1d" font-family="SFMono-Regular, Menlo, monospace" font-size="12">429 - rejected</text>
    <text x="674" y="410" fill="#8b2a1d" font-family="SFMono-Regular, Menlo, monospace" font-size="12">before cost</text>
  </g>

  <path d="M 993 254 V 316" stroke="#7c7a72" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="900" y="330" width="190" height="92" rx="14" fill="#eef9f1" stroke="#30a46c"/>
    <text x="930" y="368" fill="#143c25" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Invoice line</text>
    <text x="930" y="397" fill="#2b6b45" font-family="SFMono-Regular, Menlo, monospace" font-size="13">explained</text>
  </g>
</svg>
