  <text x="848" y="222" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="end">$0.002 / token · pro@v3</text>
  <circle cx="42" cy="260" r="4.5" fill="#ffc53d" stroke="#ffc53d" stroke-width="1.5"/>
