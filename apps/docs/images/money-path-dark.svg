  <text x="506" y="550" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11">no cost created · nothing to explain</text>
  <text x="506" y="565" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11">reason → your app · limit exceeded</text>
  <circle cx="470" cy="591" r="4.5" fill="#191918" stroke="#44443f" stroke-width="1.5"/>
  <text x="494" y="596" fill="#b5b3ad" font-family="Arial, Helvetica, sans-serif" font-size="16">Payment</text>
  <path d="M 558 592 H 753.8" stroke="#44443f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="834" y="596" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="end">no charge</text>
  <text x="66" y="618" fill="#b5b3ad" font-family="Arial, Helvetica, sans-serif" font-size="12">the money never touches Unprice</text>
</svg>
