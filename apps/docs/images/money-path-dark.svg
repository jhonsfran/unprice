<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The money path</title>
  <desc id="desc">Static version of the landing page money path. Three usage.consume requests share a $10 budget. Each request costs $4.10 for 2,050 tokens at $0.002 on pro@v3. The first two are accepted, leaving $1.80. Accepted usage moves through wallet, ledger, invoice evidence, and payment in your own Stripe account. The third is denied with LIMIT_EXCEEDED, leaving the wallet untouched, with no ledger entry, invoice line, or charge.</desc>
  <!-- Static companion to apps/nextjs/src/components/landing/money-path.tsx. Keep labels and example amounts aligned. Native SVG only: no filters, foreignObject, or external assets. -->
  <rect width="880" height="660" rx="12" fill="#191918"/>
  <text x="32" y="40" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13">THE MONEY PATH</text>
  <text x="848" y="40" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" text-anchor="end">3 requests · one budget</text>
