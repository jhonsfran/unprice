  <text x="406" y="464" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="end">capture · balanced</text>
  <circle cx="42" cy="491" r="4.5" fill="#191918" stroke="#44443f" stroke-width="1.5"/>
