  <text x="78" y="565" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11">reserve → capture · balanced</text>
  <circle cx="42" cy="591" r="4.5" fill="#191918" stroke="#44443f" stroke-width="1.5"/>
  <text x="66" y="596" fill="#eeeeec" font-family="Arial, Helvetica, sans-serif" font-size="16">Payment</text>
  <path d="M 130 592 H 279.0" stroke="#44443f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="406" y="596" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="end">your own Stripe</text>
  <rect x="460" y="328" width="388" height="72" rx="4" fill="#391714" stroke="#ff977d"/>
  <path d="M 475 345 l 12 12 m 0 -12 l -12 12" stroke="#ff977d" stroke-width="1.5"/>
  <text x="500" y="354" fill="#eeeeec" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">deny · over budget</text>
  <text x="474" y="381" fill="#ff977d" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12">LIMIT_EXCEEDED</text>
  <text x="834" y="381" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" text-anchor="end">$4.10 &gt; $1.80</text>
  <path d="M 470 400 V 586" stroke="#44443f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="470" cy="427" r="4.5" fill="#191918" stroke="#44443f" stroke-width="1.5"/>
  <text x="494" y="432" fill="#b5b3ad" font-family="Arial, Helvetica, sans-serif" font-size="16">Wallet</text>
  <path d="M 550 428 H 753.8" stroke="#44443f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="834" y="432" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="end">untouched</text>
