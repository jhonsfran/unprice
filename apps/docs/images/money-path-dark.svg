  <text x="66" y="119" fill="#b5b3ad" font-family="Arial, Helvetica, sans-serif" font-size="13">the paid action asks before it runs</text>
  <circle cx="42" cy="149" r="4.5" fill="#191918" stroke="#44443f" stroke-width="1.5"/>
  <text x="66" y="154" fill="#eeeeec" font-family="Arial, Helvetica, sans-serif" font-size="16">Meter</text>
  <path d="M 114 150 H 689.8" stroke="#44443f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="848" y="154" fill="#b5b3ad" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="end">tokens used · 2,050</text>
  <circle cx="42" cy="183" r="4.5" fill="#191918" stroke="#44443f" stroke-width="1.5"/>
